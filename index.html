<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass the Pigs - Score Keeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <video autoplay muted loop class="header-video">
                    <source src="Video/PTP.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </header>

        <div class="main-content">

            <!-- Group badge (shows which group's game is currently loaded) -->
            <div class="group-badge" id="groupBadge">
                <span id="groupBadgeLabel"></span>
                <button id="switchGroupBtn" class="switch-group-btn" title="Switch to a different group">Switch Group</button>
            </div>

            <!-- Add Player Section -->
            <div class="add-player-section">
                <h2>Add Players</h2>
                <div class="add-player-form">
                    <input type="text" id="playerNameInput" placeholder="Enter player name" maxlength="20">
                    <button id="addPlayerBtn" class="btn btn-primary">Add Player</button>                    
                    <button id="clearWinnersBtn" class="btn btn-secondary" title="Clear all winner records">Clear Winner Records</button>
                    <button id="viewScoresBtn" class="btn btn-secondary">📋 View All Scores</button>
                    <button class="open-btn" id="openModalBtn">Help</button>
                </div>
            </div>

            <!-- Players Grid (compact roster / summary cards) -->
            <div class="players-grid-header">
            </div>
            <div id="playersGrid" class="players-grid">
                <!-- Player summary cards will be inserted here -->
            </div>

            <!-- All Scores Popup (floating panel - shown alongside the Turn popup) -->
            <div class="scores-side-panel" id="scoresModal">
                <button class="close-btn" id="closeScoresModalBtn">&times;</button>
                <h3 class="scores-modal-title">All Players</h3>
                <div id="scoresModalList" class="scores-list">
                    <!-- Player name/score rows are inserted here -->
                </div>
            </div>

            <!-- Player Turn Popup -->
            <div class="modal-overlay turn-modal-overlay" id="turnModal">
                <div class="modal-content turn-modal-content">
                    <button class="close-btn" id="closeTurnModalBtn" title="Close card)">&times;</button>
                    <div id="turnModalContent">
                        <!-- Current player's turn card is inserted here -->
                    </div>
                </div>
            </div>

            <!-- Game Over Backdrop -->
            <div id="gameOverBackdrop" class="game-over-backdrop hidden"></div>
            
            <!-- Game Over Message -->
            <div id="gameOverMessage" class="game-over-message hidden">
                <div class="celebration-content">
                    <h2>🏆 Game Over! 🏆</h2>
                    <p id="winnerMessage"></p>
                    <div id="winnerLeaderboard" class="winner-leaderboard"></div>
                    <div class="reset-buttons-container">
                        <button id="resetGameBtn" class="btn btn-primary">Reset Game</button>
                        <button id="resetGameSamePlayersBtn" class="btn btn-primary">Reset Game - Same Players</button>
                    </div>
                </div>
            </div>

            <!-- Confirm / Alert Popup (styled replacement for browser confirm/alert) -->
            <div class="modal-overlay confirm-modal-overlay" id="confirmModal">
                <div class="modal-content confirm-modal-content">
                    <div class="confirm-modal-icon">🐷</div>
                    <p id="confirmModalMessage" class="confirm-modal-message"></p>
                    <div class="confirm-modal-buttons" id="confirmModalButtons">
                        <button id="confirmModalCancelBtn" class="btn btn-secondary confirm-modal-cancel">Cancel</button>
                        <button id="confirmModalOkBtn" class="btn btn-primary confirm-modal-ok">OK</button>
                    </div>
                </div>
            </div>

            <!-- Help Modal Popup -->
            <div class="modal-overlay" id="imageModal">
                <div class="modal-content">
                    <button class="close-btn" id="closeModalBtn">&times;</button>
                    <img src="Images/Pigs_Help.png" alt="Pass the Pigs Scoring Guide">
                </div>
            </div>

            <!-- Group Name Popup (shown on first visit / after switching groups) -->
            <div class="modal-overlay group-modal-overlay" id="groupModal">
                <div class="modal-content confirm-modal-content group-modal-content">
                    <div class="confirm-modal-icon">🐷</div>
                    <p class="confirm-modal-message">What's your group's name?</p>
                    <p class="group-modal-subtext">Anyone who enters the same name will see the same players and scores. Pick something unique to your group, like "Smith Family" or "Cabin 3".</p>
                    <input type="text" id="groupNameInput" class="group-name-input" placeholder="Enter group name" maxlength="40">
                    <p id="groupNameError" class="group-name-error"></p>
                    <div class="confirm-modal-buttons">
                        <button id="groupModalOkBtn" class="btn btn-primary confirm-modal-ok">Let's Play</button>
                    </div>
                </div>
            </div>

            <!-- Loading Overlay (shown while syncing with the game server) -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="loading-spinner"></div>
                <p id="loadingMessage" class="loading-message">Loading...</p>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
